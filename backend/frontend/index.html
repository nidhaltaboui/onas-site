<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - ONAS Supervision</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>ONAS</h1>
      <p class="sous-titre-login">Plateforme de supervision &amp; prédiction</p>

      <div id="message" class="message"></div>

      <form id="form-login">
        <div class="champ">
          <label for="email">Adresse email</label>
          <input type="email" id="email" required placeholder="admin@onas.tn" autocomplete="username" />
        </div>
        <div class="champ">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-principal">Se connecter</button>
      </form>

      <a href="forgot-password.html" class="lien-secondaire">Mot de passe oublié ?</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Si déjà connecté, on redirige directement vers les dashboards
    if (getToken()) {
      window.location.href = "dashboards.html";
    }

    const form = document.getElementById("form-login");
    const messageDiv = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageDiv.className = "message";
      messageDiv.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const reponse = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (!reponse.ok) {
          const erreur = await reponse.json().catch(() => ({}));
          throw new Error(erreur.detail || "Email ou mot de passe incorrect.");
        }

        const data = await reponse.json();
        setToken(data.access_token);
        localStorage.setItem("onas_nom", data.nom);
        window.location.href = "dashboards.html";
      } catch (err) {
        messageDiv.className = "message erreur";
        messageDiv.textContent = err.message;
      }
    });
  </script>
</body>
</html>
