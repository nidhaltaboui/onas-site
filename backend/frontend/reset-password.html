<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser le mot de passe - ONAS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>Nouveau mot de passe</h1>
      <p class="sous-titre-login">Choisissez un nouveau mot de passe.</p>

      <div id="message" class="message"></div>

      <form id="form-reset">
        <div class="champ">
          <label for="mdp1">Nouveau mot de passe</label>
          <input type="password" id="mdp1" required minlength="6" />
        </div>
        <div class="champ">
          <label for="mdp2">Confirmer le mot de passe</label>
          <input type="password" id="mdp2" required minlength="6" />
        </div>
        <button type="submit" class="btn-principal">Réinitialiser</button>
      </form>

      <a href="index.html" class="lien-secondaire">← Retour à la connexion</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const form = document.getElementById("form-reset");
    const messageDiv = document.getElementById("message");

    if (!token) {
      messageDiv.className = "message erreur";
      messageDiv.textContent = "Jeton manquant. Utilisez le lien reçu par email.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const mdp1 = document.getElementById("mdp1").value;
      const mdp2 = document.getElementById("mdp2").value;

      if (mdp1 !== mdp2) {
        messageDiv.className = "message erreur";
        messageDiv.textContent = "Les mots de passe ne correspondent pas.";
        return;
      }

      try {
        const reponse = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, nouveau_mot_de_passe: mdp1 }),
        });
        if (!reponse.ok) {
          const erreur = await reponse.json().catch(() => ({}));
          throw new Error(erreur.detail || "Erreur lors de la réinitialisation.");
        }
        messageDiv.className = "message succes";
        messageDiv.textContent = "Mot de passe changé ! Redirection...";
        setTimeout(() => (window.location.href = "index.html"), 1500);
      } catch (err) {
        messageDiv.className = "message erreur";
        messageDiv.textContent = err.message;
      }
    });
  </script>
</body>
</html>
