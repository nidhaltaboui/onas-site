<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié - ONAS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>Mot de passe oublié</h1>
      <p class="sous-titre-login">Entrez votre email, un lien de réinitialisation vous sera envoyé.</p>

      <div id="message" class="message"></div>

      <form id="form-forgot">
        <div class="champ">
          <label for="email">Adresse email</label>
          <input type="email" id="email" required placeholder="admin@onas.tn" />
        </div>
        <button type="submit" class="btn-principal">Envoyer le lien</button>
      </form>

      <a href="index.html" class="lien-secondaire">← Retour à la connexion</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("form-forgot");
    const messageDiv = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();

      try {
        const reponse = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await reponse.json();
        messageDiv.className = "message succes";
        messageDiv.textContent = data.message;
      } catch (err) {
        messageDiv.className = "message erreur";
        messageDiv.textContent = "Une erreur est survenue, réessayez.";
      }
    });
  </script>
</body>
</html>
